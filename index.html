<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLUXE </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cho.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="brand-logo">STYLUXE</div>
            <nav class="nav-links">
                <a href="#" onclick="selectDepartmentTab('Men')">MEN</a>
                <a href="#" onclick="selectDepartmentTab('Women')">WOMEN</a>
                <a href="#" onclick="selectDepartmentTab('Kids')">KIDS</a>
                <a href="#admin" onclick="showTab('admin')" class="admin-link"><i class="fa-solid fa-user-shield"></i> ADMIN</a>
            </nav>
            <div class="nav-actions">
                <button onclick="toggleCart()" class="cart-btn">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cartCount" class="cart-badge">0</span>
                </button>
            </div>
        </div>
    </header>

    <main id="storefrontView" class="main-view active">
        <section class="hero-banner">
            <div class="hero-content">
                <h1 class="hero-title">NEW SEASON ARRIVALS</h1>
                <p class="hero-subtitle">Discover modern luxury fashion & accessories</p>
            </div>
        </section>

        <div class="dept-tabs-container">
            <button class="dept-tab active" onclick="selectDepartmentTab('Men', this)">MEN</button>
            <button class="dept-tab" onclick="selectDepartmentTab('Women', this)">WOMEN</button>
            <button class="dept-tab" onclick="selectDepartmentTab('Kids', this)">KIDS</button>
        </div>

        <section class="products-section">
            <h2 class="section-title">CURATED COLLECTION</h2>
            <div id="productGrid" class="products-grid"></div>
        </section>
    </main>

    <section id="adminView" class="main-view">
        <div class="admin-layout">
            <aside class="admin-sidebar">
                <div class="admin-sidebar-title">STYLUXE  ADMIN</div>
                <button onclick="showAdminSubTab('products')" class="admin-nav-btn active"><i class="fa-solid fa-box"></i> Products</button>
                <button onclick="showAdminSubTab('add-product')" class="admin-nav-btn"><i class="fa-solid fa-plus"></i> Add Product</button>
                <button onclick="showTab('storefront')" class="admin-nav-btn exit-btn"><i class="fa-solid fa-store"></i> Back to Store</button>
            </aside>
            <main class="admin-content">
                <div id="adminProductsTab" class="admin-tab active">
                    <div class="admin-header">
                        <h3>MANAGE PRODUCTS</h3>
                        <button onclick="showAdminSubTab('add-product')" class="btn-primary">+ ADD NEW PRODUCT</button>
                    </div>
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                 <tr>
                                     <th>IMAGE</th>
                                     <th>NAME</th>
                                     <th>DEPARTMENT</th>
                                     <th>PRICE</th>
                                     <th>ACTIONS</th>
                                 </tr>
                            </thead>
                            <tbody id="adminProductsTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="adminAddProductTab" class="admin-tab">
                    <h3>ADD NEW PRODUCT</h3>
                    <form onsubmit="handleCreateProduct(event)" class="admin-form">
                        <div class="form-group">
                            <label>Product Name *</label>
                            <input type="text" id="newProdName" required placeholder="e.g. LUX-HOODIE">
                        </div>
                        <div class="form-group">
                            <label>Price ($) *</label>
                            <input type="number" step="0.01" id="newProdPrice" required placeholder="150.00">
                        </div>
                        <div class="form-group">
                            <label>Department *</label>
                            <select id="newProdDept" required>
                                 <option value="Men">Men</option>
                                 <option value="Women">Women</option>
                                 <option value="Kids">Kids</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Category *</label>
                            <input type="text" id="newProdCategory" required placeholder="e.g. Ready to Wear">
                        </div>
                        <div class="form-group">
                            <label>Image URL *</label>
                            <input type="text" id="newProdImg" required value="assets/hoodie_black.png">
                        </div>
                        <button type="submit" class="btn-primary">SAVE PRODUCT</button>
                    </form>
                </div>
            </main>
        </div>
    </section>

    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h3>YOUR SHOPPING BAG</h3>
            <button olclick="toggleCart()" class="close-btn">&times;</button>
        </div>
        <div id="cartItemsList" class="cart-body"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <strong id="cartTotalPrice">$0.00</strong>
            </div>
            <button onclick="aliert('Checkout process initiated!')" class="btn-primary checkout-btn">PROCEED TO CHECKOUT</button>
        </div>
    </div>
    <div id="cartBackdrop" class="cart-backdrop" onclick="toggleCart()"></div>

    <script src="app.js"></script>
</body>
</html>
